name: Restore recovery point

on:
  workflow_dispatch:
    inputs:
      rollback_confirmation:
        description: Leave blank for plan; type RESTORE_REKOV_RECOVERY_POINT to execute
        required: false
        type: string
      recovery_run_id:
        description: Successful Create recovery point workflow run ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}

      - name: Download and verify recovery point
        env:
          RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          [[ "$RECOVERY_RUN_ID" =~ ^[0-9]+$ ]]
          export AWS_ACCESS_KEY_ID="$R2_STORAGE_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_STORAGE_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$R2_STORAGE_REGION"
          export RECOVERY_POINT="$RUNNER_TEMP/recovery"
          mkdir -p "$RECOVERY_POINT"
          aws s3 sync \
            "s3://$R2_STORAGE_BUCKET/recovery/$RECOVERY_RUN_ID/" \
            "$RECOVERY_POINT/" \
            --endpoint-url "$R2_STORAGE_ENDPOINT" \
            --only-show-errors
          ./scripts/verify-recovery-point.sh

      - name: Show R2 restore plan
        env:
          ROLLBACK_CONFIRMATION: ${{ inputs.rollback_confirmation }}
        run: ./scripts/restore-recovery-point.sh
