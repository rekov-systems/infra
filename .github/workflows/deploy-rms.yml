name: Deploy RMS

on:
  workflow_dispatch:
    inputs:
      backup_before_cutover:
        description: Create a new encrypted backup of both existing VPS before deployment
        required: true
        default: true
        type: boolean
      reinstall_contabo:
        description: Reinstall the existing Contabo VPS from standard Ubuntu 24.04
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: rekov-rms-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare upstream POS with Rekov overlay
        env:
          POS_ROOT: ${{ runner.temp }}/rms-pos
        run: |
          scripts/prepare-pos-overlay.sh apps/pos "$POS_ROOT"
          echo "POS_ROOT=$POS_ROOT" >> "$GITHUB_ENV"

      - name: Load production secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}

      - name: Validate required Infisical values before changing server access
        env:
          ROOT_DOMAIN: ${{ env.CLOUDFLARE_ROOT_DOMAIN || env.PRESS_ROOT_DOMAIN }}
        run: |
          : "${CONTABO_API_USER:?Add CONTABO_API_USER to Infisical}"
          : "${CONTABO_API_PASSWORD:?Add CONTABO_API_PASSWORD to Infisical}"
          : "${CONTABO_CLIENT_ID:?Add CONTABO_CLIENT_ID to Infisical}"
          : "${CONTABO_CLIENT_SECRET:?Add CONTABO_CLIENT_SECRET to Infisical}"
          : "${CONTABO_PRODUCT_ID:?Add CONTABO_PRODUCT_ID to Infisical}"
          : "${CONTABO_REGION:?Add CONTABO_REGION to Infisical}"
          : "${CONTABO_ROOT_PASSWORD:?Add CONTABO_ROOT_PASSWORD to Infisical}"
          : "${CONTABO_SSH_PRIVATE_KEY:?Add CONTABO_SSH_PRIVATE_KEY to Infisical}"
          : "${CONTABO_SSH_PUBLIC_KEY:?Add CONTABO_SSH_PUBLIC_KEY to Infisical}"
          : "${SUPABASE_DB_PASSWORD:?Add SUPABASE_DB_PASSWORD to Infisical}"
          : "${SUPABASE_DASHBOARD_PASSWORD:?Add SUPABASE_DASHBOARD_PASSWORD to Infisical}"
          : "${TENANT_SECRETS_ENCRYPTION_KEY:?Add TENANT_SECRETS_ENCRYPTION_KEY to Infisical}"
          : "${META_APP_ID:?Add Desk approved app ID META_APP_ID to Infisical}"
          : "${META_APP_SECRET:?Add META_APP_SECRET to Infisical}"
          : "${WHATSAPP_EMBEDDED_CONFIG_ID:?Add Desk approved WhatsApp Embedded Signup config ID to Infisical}"
          : "${CLOUDFLARE_WORKERS_AI_TOKEN:?Add CLOUDFLARE_WORKERS_AI_TOKEN with Workers AI permissions to Infisical}"
          : "${META_WEBHOOK_VERIFY_TOKEN:?Add the existing META_WEBHOOK_VERIFY_TOKEN to Infisical}"
          : "${RMS_PLATFORM_ADMIN_EMAIL:?Add RMS_PLATFORM_ADMIN_EMAIL to Infisical}"
          : "${RMS_PLATFORM_ADMIN_PASSWORD:?Add RMS_PLATFORM_ADMIN_PASSWORD to Infisical}"
          : "${OCI_NEXT_SSH_PRIVATE_KEY:?Add OCI_NEXT_SSH_PRIVATE_KEY for OCI to Infisical}"
          : "${OCI_NEXT_SSH_PUBLIC_KEY:?Add OCI_NEXT_SSH_PUBLIC_KEY for OCI to Infisical}"
          : "${TF_VAR_private_key:?Add TF_VAR_private_key for OCI API signing to Infisical}"
          : "${TF_VAR_tenancy_ocid:?Add TF_VAR_tenancy_ocid to Infisical}"
          : "${TF_VAR_user_ocid:?Add TF_VAR_user_ocid to Infisical}"
          : "${TF_VAR_fingerprint:?Add TF_VAR_fingerprint to Infisical}"
          : "${TF_VAR_oci_region:?Add TF_VAR_oci_region to Infisical}"
          : "${TF_VAR_compartment_ocid:?Add TF_VAR_compartment_ocid to Infisical}"
          : "${TF_VAR_cloudflare_account_id:?Add TF_VAR_cloudflare_account_id to Infisical}"
          : "${TF_VAR_cloudflare_api_token:?Add TF_VAR_cloudflare_api_token to Infisical}"
          : "${TF_VAR_cloudflare_zone_id:?Add TF_VAR_cloudflare_zone_id to Infisical}"
          : "${ROOT_DOMAIN:?Add CLOUDFLARE_ROOT_DOMAIN or retain PRESS_ROOT_DOMAIN in Infisical}"
          : "${RECOVERY_PASSPHRASE:?Add RECOVERY_PASSPHRASE to Infisical}"
          : "${R2_STORAGE_ACCESS_KEY_ID:?Add R2_STORAGE_ACCESS_KEY_ID to Infisical}"
          : "${R2_STORAGE_SECRET_ACCESS_KEY:?Add R2_STORAGE_SECRET_ACCESS_KEY to Infisical}"
          : "${R2_STORAGE_REGION:?Add R2_STORAGE_REGION to Infisical}"
          : "${R2_STORAGE_BUCKET:?Add R2_STORAGE_BUCKET to Infisical}"
          : "${R2_STORAGE_ENDPOINT:?Add R2_STORAGE_ENDPOINT to Infisical}"
          : "${R2_STORAGE_STATE_KEY:?Add R2_STORAGE_STATE_KEY to Infisical}"

      - name: Resolve existing Contabo VPS and apply credentials through its API
        env:
          CONTABO_API_USER: ${{ env.CONTABO_API_USER }}
          CONTABO_API_PASSWORD: ${{ env.CONTABO_API_PASSWORD }}
          CONTABO_CLIENT_ID: ${{ env.CONTABO_CLIENT_ID }}
          CONTABO_CLIENT_SECRET: ${{ env.CONTABO_CLIENT_SECRET }}
          CONTABO_PRODUCT_ID: ${{ env.CONTABO_PRODUCT_ID }}
          CONTABO_REGION: ${{ env.CONTABO_REGION }}
          CONTABO_ROOT_PASSWORD: ${{ env.CONTABO_ROOT_PASSWORD }}
          CONTABO_SSH_PRIVATE_KEY: ${{ env.CONTABO_SSH_PRIVATE_KEY }}
          CONTABO_SSH_PUBLIC_KEY: ${{ env.CONTABO_SSH_PUBLIC_KEY }}
        run: scripts/prepare-contabo-access.sh

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Resolve the existing OCI host and Terraform state
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_STORAGE_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.R2_STORAGE_REGION }}
          TF_VAR_cloudflare_api_token: ${{ env.TF_VAR_cloudflare_api_token }}
          TF_VAR_cloudflare_zone_id: ${{ env.TF_VAR_cloudflare_zone_id }}
          TF_VAR_compartment_ocid: ${{ env.TF_VAR_compartment_ocid }}
          TF_VAR_fingerprint: ${{ env.TF_VAR_fingerprint }}
          TF_VAR_oci_region: ${{ env.TF_VAR_oci_region }}
          TF_VAR_private_key: ${{ env.TF_VAR_private_key }}
          TF_VAR_ssh_public_key: ${{ env.OCI_NEXT_SSH_PUBLIC_KEY }}
          TF_VAR_tenancy_ocid: ${{ env.TF_VAR_tenancy_ocid }}
          TF_VAR_user_ocid: ${{ env.TF_VAR_user_ocid }}
          TF_VAR_cloudflare_root_domain: ${{ env.CLOUDFLARE_ROOT_DOMAIN || env.PRESS_ROOT_DOMAIN }}
          TF_VAR_contabo_public_ip: ${{ env.CONTABO_PUBLIC_IP }}
          TF_VAR_ocpus: "2"
          TF_VAR_memory_in_gbs: "12"
        run: |
          for attempt in 1 2 3; do
            if terraform -chdir=terraform init -input=false \
              -backend-config="bucket=$R2_STORAGE_BUCKET" \
              -backend-config="key=$R2_STORAGE_STATE_KEY" \
              -backend-config="region=$R2_STORAGE_REGION" \
              -backend-config="endpoint=$R2_STORAGE_ENDPOINT" \
              -backend-config="skip_credentials_validation=true" \
              -backend-config="skip_metadata_api_check=true" \
              -backend-config="skip_requesting_account_id=true" \
              -backend-config="skip_region_validation=true" \
              -backend-config="skip_s3_checksum=true" \
              -backend-config="use_path_style=true"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep "$((attempt * 10))"
          done
          terraform -chdir=terraform state pull > "$RUNNER_TEMP/terraform-state.json"
          echo "OCI_POS_IP=$(terraform -chdir=terraform output -raw oci_pos_public_ip)" >> "$GITHUB_ENV"

      - name: Back up both VPS before cutover
        if: ${{ inputs.backup_before_cutover }}
        env:
          RECOVERY_DIR: ${{ runner.temp }}/rms-recovery
          RECOVERY_PASSPHRASE: ${{ env.RECOVERY_PASSPHRASE }}
          AWS_ACCESS_KEY_ID: ${{ env.R2_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_STORAGE_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ env.R2_STORAGE_REGION }}
        run: |
          : "${OCI_POS_IP:?OCI public IP was not resolved from Terraform state}"
          : "${CONTABO_PUBLIC_IP:?Contabo public IP was not resolved from the Contabo API}"
          : "${CONTABO_SSH_USER:?Contabo SSH user was not resolved from the Contabo API}"
          mkdir -p "$RECOVERY_DIR"
          printf '%s\n' "$OCI_NEXT_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/oci_key"
          chmod 600 "$RUNNER_TEMP/oci_key" "$RUNNER_TEMP/contabo_key"
          BACKUP_HOST="$OCI_POS_IP" BACKUP_USER=ubuntu BACKUP_LABEL=oci \
            BACKUP_SSH_KEY="$OCI_NEXT_SSH_PRIVATE_KEY" bash scripts/backup-vps.sh
          BACKUP_HOST="$CONTABO_PUBLIC_IP" BACKUP_USER="$CONTABO_SSH_USER" \
            BACKUP_LABEL=contabo BACKUP_SSH_KEY="$(cat "$RUNNER_TEMP/contabo_key")" \
            bash scripts/backup-vps.sh
          cp "$RUNNER_TEMP/terraform-state.json" "$RECOVERY_DIR/terraform-state.json"
          (cd "$RECOVERY_DIR" && sha256sum * > SHA256SUMS)
          aws s3 sync "$RECOVERY_DIR" "s3://$R2_STORAGE_BUCKET/recovery/rms/$GITHUB_RUN_ID/" \
            --endpoint-url "$R2_STORAGE_ENDPOINT" --only-show-errors

      - name: Release the Desk hostname from its previous Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TF_VAR_cloudflare_api_token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.TF_VAR_cloudflare_account_id }}
          DESK_HOSTNAME: desk.${{ env.CLOUDFLARE_ROOT_DOMAIN || env.PRESS_ROOT_DOMAIN }}
        run: scripts/detach-cloudflare-worker-domain.sh

      - name: Reinstall the existing Contabo VPS from a clean image after backup
        if: ${{ inputs.reinstall_contabo }}
        env:
          CONTABO_API_USER: ${{ env.CONTABO_API_USER }}
          CONTABO_API_PASSWORD: ${{ env.CONTABO_API_PASSWORD }}
          CONTABO_CLIENT_ID: ${{ env.CONTABO_CLIENT_ID }}
          CONTABO_CLIENT_SECRET: ${{ env.CONTABO_CLIENT_SECRET }}
          CONTABO_PRODUCT_ID: ${{ env.CONTABO_PRODUCT_ID }}
          CONTABO_REGION: ${{ env.CONTABO_REGION }}
          CONTABO_ROOT_PASSWORD: ${{ env.CONTABO_ROOT_PASSWORD }}
          CONTABO_SSH_PUBLIC_KEY: ${{ env.CONTABO_SSH_PUBLIC_KEY }}
        run: scripts/reinstall-contabo-vps.sh

      - name: Reconcile DNS while retaining both hosts
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_STORAGE_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ env.R2_STORAGE_REGION }}
          TF_VAR_cloudflare_api_token: ${{ env.TF_VAR_cloudflare_api_token }}
          TF_VAR_cloudflare_zone_id: ${{ env.TF_VAR_cloudflare_zone_id }}
          TF_VAR_compartment_ocid: ${{ env.TF_VAR_compartment_ocid }}
          TF_VAR_fingerprint: ${{ env.TF_VAR_fingerprint }}
          TF_VAR_oci_region: ${{ env.TF_VAR_oci_region }}
          TF_VAR_private_key: ${{ env.TF_VAR_private_key }}
          TF_VAR_ssh_public_key: ${{ env.OCI_NEXT_SSH_PUBLIC_KEY }}
          TF_VAR_tenancy_ocid: ${{ env.TF_VAR_tenancy_ocid }}
          TF_VAR_user_ocid: ${{ env.TF_VAR_user_ocid }}
          TF_VAR_cloudflare_root_domain: ${{ env.CLOUDFLARE_ROOT_DOMAIN || env.PRESS_ROOT_DOMAIN }}
          TF_VAR_contabo_public_ip: ${{ env.CONTABO_PUBLIC_IP }}
          TF_VAR_ocpus: "2"
          TF_VAR_memory_in_gbs: "12"
        run: |
          terraform -chdir=terraform plan -input=false -out="$RUNNER_TEMP/rms.tfplan"
          terraform -chdir=terraform show -json "$RUNNER_TEMP/rms.tfplan" \
            | jq -e '[.resource_changes[] | select(.type == "oci_core_instance" or .type == "oci_core_vcn" or .type == "oci_core_subnet") | select(.change.actions | index("delete"))] | length == 0' >/dev/null
          terraform -chdir=terraform apply -input=false -auto-approve "$RUNNER_TEMP/rms.tfplan"

      - name: Prepare SSH keys
        run: |
          umask 077
          printf '%s\n' "$OCI_NEXT_SSH_PRIVATE_KEY" | perl -pe 's/\\\\n/\n/g; s/\r//g' > "$RUNNER_TEMP/oci_key"
          chmod 600 "$RUNNER_TEMP/oci_key"
          ssh-keygen -y -f "$RUNNER_TEMP/oci_key" >/dev/null

      - name: Bootstrap Supabase on Contabo
        env:
          SUPABASE_DB_PASSWORD: ${{ env.SUPABASE_DB_PASSWORD }}
          SUPABASE_DASHBOARD_PASSWORD: ${{ env.SUPABASE_DASHBOARD_PASSWORD }}
          RMS_PLATFORM_ADMIN_EMAIL: ${{ env.RMS_PLATFORM_ADMIN_EMAIL }}
          RMS_PLATFORM_ADMIN_PASSWORD: ${{ env.RMS_PLATFORM_ADMIN_PASSWORD }}
          TENANT_SECRETS_ENCRYPTION_KEY: ${{ env.TENANT_SECRETS_ENCRYPTION_KEY }}
          META_APP_ID: ${{ env.META_APP_ID }}
          META_APP_SECRET: ${{ env.META_APP_SECRET }}
          WHATSAPP_EMBEDDED_CONFIG_ID: ${{ env.WHATSAPP_EMBEDDED_CONFIG_ID }}
          META_GRAPH_VERSION: ${{ env.META_GRAPH_VERSION }}
          META_WEBHOOK_VERIFY_TOKEN: ${{ env.META_WEBHOOK_VERIFY_TOKEN }}
          CLOUDFLARE_WORKERS_AI_TOKEN: ${{ env.CLOUDFLARE_WORKERS_AI_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ env.TF_VAR_cloudflare_account_id }}
          RAPPI_API_BASE: ${{ env.RAPPI_API_BASE }}
          RAPPI_CLIENT_ID: ${{ env.RAPPI_CLIENT_ID }}
          RAPPI_CLIENT_SECRET: ${{ env.RAPPI_CLIENT_SECRET }}
          RAPPI_WEBHOOK_SECRET: ${{ env.RAPPI_WEBHOOK_SECRET }}
          RAPPI_IP_ALLOWLIST: ${{ env.RAPPI_IP_ALLOWLIST }}
        run: |
          target="${CONTABO_SSH_USER:-ubuntu}@$CONTABO_PUBLIC_IP"
          scripts/prepare-pos-migrations.sh "$POS_ROOT/supabase/migrations" "$RUNNER_TEMP/rms-migrations" deploy/migrations
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            scripts/bootstrap-supabase-contabo.sh scripts/migrate-pos-db.sh \
            scripts/activate-supabase-contabo.sh deploy/supabase-compose.yml \
            deploy/Caddyfile.contabo "$target:/tmp/"
          ssh -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new "$target" \
            'mkdir -p /tmp/rms-pos-supabase /tmp/rms-custom-functions'
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new -r \
            "$RUNNER_TEMP/rms-migrations" "$POS_ROOT/supabase/functions" "$target:/tmp/rms-pos-supabase/"
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new -r \
            deploy/functions/. "$target:/tmp/rms-custom-functions/"
          { printf 'SUPABASE_DB_PASSWORD=%q\n' "$SUPABASE_DB_PASSWORD"; \
            printf 'SUPABASE_DASHBOARD_PASSWORD=%q\n' "$SUPABASE_DASHBOARD_PASSWORD"; \
            printf 'RMS_PLATFORM_ADMIN_EMAIL=%q\n' "$RMS_PLATFORM_ADMIN_EMAIL"; \
            printf 'RMS_PLATFORM_ADMIN_PASSWORD=%q\n' "$RMS_PLATFORM_ADMIN_PASSWORD"; \
            printf 'TENANT_SECRETS_ENCRYPTION_KEY=%q\n' "$TENANT_SECRETS_ENCRYPTION_KEY"; \
            printf 'META_APP_ID=%q\n' "$META_APP_ID"; \
            printf 'META_APP_SECRET=%q\n' "$META_APP_SECRET"; \
            printf 'WHATSAPP_EMBEDDED_CONFIG_ID=%q\n' "$WHATSAPP_EMBEDDED_CONFIG_ID"; \
            printf 'META_GRAPH_VERSION=%q\n' "${META_GRAPH_VERSION:-v26.0}"; \
            printf 'META_WEBHOOK_VERIFY_TOKEN=%q\n' "$META_WEBHOOK_VERIFY_TOKEN"; \
            printf 'CF_ACCOUNT_ID=%q\n' "$TF_VAR_cloudflare_account_id"; \
            printf 'CLOUDFLARE_WORKERS_AI_TOKEN=%q\n' "$CLOUDFLARE_WORKERS_AI_TOKEN"; \
            printf 'RAPPI_API_BASE=%q\n' "${RAPPI_API_BASE:-}"; \
            printf 'RAPPI_CLIENT_ID=%q\n' "${RAPPI_CLIENT_ID:-}"; \
            printf 'RAPPI_CLIENT_SECRET=%q\n' "${RAPPI_CLIENT_SECRET:-}"; \
            printf 'RAPPI_WEBHOOK_SECRET=%q\n' "${RAPPI_WEBHOOK_SECRET:-}"; \
            printf 'RAPPI_IP_ALLOWLIST=%q\n' "${RAPPI_IP_ALLOWLIST:-}"; } \
            > "$RUNNER_TEMP/contabo.env"
          tar -czf "$RUNNER_TEMP/rms-custom-functions.tgz" -C deploy/functions .
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/contabo.env" "$target:/tmp/rms.env"
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/rms-custom-functions.tgz" "$target:/tmp/rms-custom-functions.tgz"
          ssh -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new "$target" \
            'sudo bash -lc "set -e; chmod 600 /tmp/rms.env; set -a; source /tmp/rms.env; set +a; install -m 0644 /tmp/supabase-compose.yml /tmp/rms-supabase-compose.yml; install -m 0644 /tmp/Caddyfile.contabo /tmp/rms-Caddyfile; rm -rf /tmp/rms-custom-functions; mkdir -p /tmp/rms-custom-functions /tmp/rms-migrations /tmp/rms-functions; tar -xzf /tmp/rms-custom-functions.tgz -C /tmp/rms-custom-functions; cp -a /tmp/rms-pos-supabase/rms-migrations/. /tmp/rms-migrations/; cp -a /tmp/rms-pos-supabase/functions/. /tmp/rms-functions/; bash /tmp/bootstrap-supabase-contabo.sh; MIGRATIONS_DIR=/tmp/rms-migrations bash /tmp/migrate-pos-db.sh; bash /tmp/activate-supabase-contabo.sh"'

      - name: Read the public Supabase publishable key
        id: supabase
        run: |
          key="$(ssh -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            "${CONTABO_SSH_USER:-ubuntu}@$CONTABO_PUBLIC_IP" \
            "sudo grep '^SUPABASE_PUBLISHABLE_KEY=' /opt/rms/supabase/.env | cut -d= -f2-")"
          test -n "$key"
          echo "publishable_key=$key" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pos/package-lock.json

      - name: Build POS with the self-hosted Supabase endpoint
        working-directory: ${{ runner.temp }}/rms-pos
        env:
          VITE_SUPABASE_URL: https://api.desk.rekov.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
        run: npm ci && npm run build

      - name: Add the independent Rekov control panel to the POS bundle
        env:
          VITE_SUPABASE_URL: https://api.desk.rekov.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
        run: node scripts/build-control.mjs apps/control "$RUNNER_TEMP/rms-pos/dist/control"

      - name: Deploy POS to OCI and cut over after local health check
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.TF_VAR_cloudflare_api_token }}
        run: |
          tar -czf "$RUNNER_TEMP/rms-pos-dist.tgz" -C "$RUNNER_TEMP/rms-pos/dist" .
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN" > "$RUNNER_TEMP/oci.env"
          scp -i "$RUNNER_TEMP/oci_key" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/rms-pos-dist.tgz" scripts/deploy-pos-oci.sh \
            deploy/oci-compose.yml deploy/Caddyfile.oci deploy/nginx-pos.conf \
            deploy/caddy-cloudflare.Dockerfile "$RUNNER_TEMP/oci.env" \
            "ubuntu@$OCI_POS_IP:/tmp/"
          ssh -i "$RUNNER_TEMP/oci_key" -o StrictHostKeyChecking=accept-new \
            "ubuntu@$OCI_POS_IP" 'sudo bash /tmp/deploy-pos-oci.sh'

      - name: Verify public Supabase and POS
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ steps.supabase.outputs.publishable_key }}
        run: |
          curl --retry 30 --retry-delay 3 --retry-connrefused -fsS \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            https://api.desk.rekov.co/auth/v1/health >/dev/null
          curl --retry 30 --retry-delay 3 --retry-connrefused -fsS \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            'https://api.desk.rekov.co/rest/v1/tenants?select=id&limit=1' >/dev/null
          curl --retry 30 --retry-delay 3 --retry-connrefused -fsS \
            https://desk.rekov.co/health
          curl --retry 30 --retry-delay 3 --retry-connrefused --retry-all-errors -fsS \
            https://desk.rekov.co/ -o "$RUNNER_TEMP/rms-index.html"
          grep -q '<div id="root">' "$RUNNER_TEMP/rms-index.html"
          curl --retry 30 --retry-delay 3 --retry-connrefused --retry-all-errors -fsSL \
            https://control.desk.rekov.co/ -o "$RUNNER_TEMP/rms-control-index.html"
          grep -q '<div id="app">' "$RUNNER_TEMP/rms-control-index.html"
          curl --retry 10 --retry-delay 2 --retry-connrefused --retry-all-errors -fsS \
            https://control.desk.rekov.co/app.js -o "$RUNNER_TEMP/rms-control-app.js"
          grep -q 'PANEL DE PLATAFORMA' "$RUNNER_TEMP/rms-control-app.js"
          echo "RMS deployed. Encrypted previous state: recovery/rms/$GITHUB_RUN_ID/"

      - name: Retire the backed-up Pilot and ERPNext installations
        run: |
          scp -i "$RUNNER_TEMP/oci_key" -o StrictHostKeyChecking=accept-new \
            scripts/retire-legacy-vps.sh "ubuntu@$OCI_POS_IP:/tmp/"
          scp -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            scripts/retire-legacy-vps.sh "${CONTABO_SSH_USER:-ubuntu}@$CONTABO_PUBLIC_IP:/tmp/"
          ssh -i "$RUNNER_TEMP/oci_key" -o StrictHostKeyChecking=accept-new \
            "ubuntu@$OCI_POS_IP" 'sudo bash /tmp/retire-legacy-vps.sh'
          ssh -i "$RUNNER_TEMP/contabo_key" -o StrictHostKeyChecking=accept-new \
            "${CONTABO_SSH_USER:-ubuntu}@$CONTABO_PUBLIC_IP" 'sudo bash /tmp/retire-legacy-vps.sh'
