name: Deploy ERPNext

on:
  workflow_dispatch:
    inputs:
      recovery_run_id:
        description: Successful Create recovery point workflow run ID
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: rekov-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      # Must match the Infisical OIDC subject configured for this repository:
      # repo:rekov-systems@286721205/infra@1448465422:environment:production.
      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Validate Terraform and deployment scripts
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          bash -n scripts/deploy.sh scripts/bootstrap-press-control.sh
          bash -n scripts/collect-recovery-manifest.sh
          bash -n scripts/verify-recovery-point.sh
          bash -n scripts/create-provider-recovery-snapshots.sh
          bash -n scripts/restore-recovery-point.sh
          bash -n scripts/test-recovery-point.sh
          ./scripts/test-recovery-point.sh
          OCI_INSTANCE_ID=plan-test \
            OCI_BOOT_VOLUME_BACKUP_ID=plan-test \
            CONTABO_INSTANCE_ID=plan-test \
            CONTABO_SNAPSHOT_ID=plan-test \
            ./scripts/restore-recovery-point.sh | grep -q '^Plan only\.'
          bash scripts/verify-press-source.sh

      - name: Provision Press control plane, tenant node, and DNS
        env:
          REKOV_NATIVE_ONLY: "1"
          REKOV_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
        run: ./scripts/deploy.sh
