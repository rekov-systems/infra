name: Create recovery point

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type CREATE_RECOVERY_POINT to continue
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: rekov-recovery-point
  cancel-in-progress: false

jobs:
  backup:
    if: github.event.inputs.confirmation == 'CREATE_RECOVERY_POINT'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Load secrets from Infisical
        uses: Infisical/secrets-action@v1.0.18
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Resolve current VM addresses
        working-directory: terraform
        run: |
          export AWS_ACCESS_KEY_ID="$R2_STORAGE_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_STORAGE_SECRET_ACCESS_KEY"
          export AWS_REGION="$R2_STORAGE_REGION"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=$R2_STORAGE_BUCKET" \
            -backend-config="key=$R2_STORAGE_STATE_KEY" \
            -backend-config="region=$R2_STORAGE_REGION" \
            -backend-config="endpoint=$R2_STORAGE_ENDPOINT" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
          echo "CONTROL_IP=$(terraform output -raw control_public_ip)" >> "$GITHUB_ENV"
          echo "OCI_INSTANCE_ID=$(terraform output -raw control_instance_id)" >> "$GITHUB_ENV"
          echo "TENANT_IP=$(terraform output -raw erp_public_ip)" >> "$GITHUB_ENV"
          echo "CONTABO_INSTANCE_ID=$(terraform output -raw erp_contabo_id)" >> "$GITHUB_ENV"

      - name: Install snapshot tooling
        run: python3 -m pip install --user --quiet oci-cli

      - name: Create provider recovery snapshots
        run: ./scripts/create-provider-recovery-snapshots.sh

      - name: Collect and verify encrypted recovery point
        env:
          RECOVERY_OUTPUT_DIR: ${{ runner.temp }}/recovery
        run: |
          export RECOVERY_POINT="$RECOVERY_OUTPUT_DIR"
          ./scripts/collect-recovery-manifest.sh
          ./scripts/verify-recovery-point.sh

      - name: Upload recovery point to R2
        env:
          RECOVERY_OUTPUT_DIR: ${{ runner.temp }}/recovery
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          export AWS_ACCESS_KEY_ID="$R2_STORAGE_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_STORAGE_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION="$R2_STORAGE_REGION"
          aws s3 sync "$RECOVERY_OUTPUT_DIR" \
            "s3://$R2_STORAGE_BUCKET/recovery/$GITHUB_RUN_ID/" \
            --endpoint-url "$R2_STORAGE_ENDPOINT" \
            --only-show-errors
          echo "Recovery point uploaded under recovery/$GITHUB_RUN_ID/"
