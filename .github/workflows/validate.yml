name: Validate infrastructure

on:
  pull_request:
  push:
    branches:
      - main
      - experiment/native-press-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Validate source and recovery contracts
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          bash -n scripts/*.sh
          ./scripts/test-recovery-point.sh
          OCI_INSTANCE_ID=plan-test \
          ./scripts/restore-recovery-point.sh | grep -q '^Plan only\.'

      - name: Validate Rekov Factus Frappe app metadata
        run: |
          test -f pyproject.toml
          test -f rekov_factus/hooks.py
          test -f rekov_factus/modules.txt
          python3 -m compileall -q rekov_factus
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("rekov_factus/rekov_factus/doctype/factus_settings/factus_settings.json")
          data = json.loads(path.read_text())
          assert data["doctype"] == "DocType"
          assert data["name"] == "Factus Settings"
          assert data["issingle"] == 1
          assert {field["fieldname"] for field in data["fields"]} >= {
              "environment", "send_automatically"
          }
          assert not {field["fieldname"] for field in data["fields"]} & {
              "api_key", "webhook_secret"
          }
          company = json.loads(Path("rekov_factus/rekov_factus/doctype/factus_company/factus_company.json").read_text())
          assert company["name"] == "Factus Company"
          assert {field["fieldname"] for field in company["fields"]} >= {
              "company", "identification_document_code", "tax_id",
              "environment",
              "tax_id_verification_digit", "legal_name", "legal_organization_code",
              "tribute_code", "country_code", "tax_responsibilities",
              "municipality_code", "address", "billing_email", "phone",
              "numbering_range_id", "client_id", "client_secret", "email",
              "password", "enabled"
          }
          log = json.loads(Path("rekov_factus/rekov_factus/doctype/factus_transmission_log/factus_transmission_log.json").read_text())
          assert log["name"] == "Factus Transmission Log"
          assert {field["fieldname"] for field in log["fields"]} >= {
              "sales_invoice", "status", "factus_number", "cufe", "public_url",
              "qr_url", "request_json", "response_json"
          }
          print("Frappe app metadata is valid")
          PY
