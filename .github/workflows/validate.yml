name: Validate infrastructure

on:
  pull_request:
  push:
    branches:
      - experiment/native-press-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9

      - name: Validate source and recovery contracts
        run: |
          terraform -chdir=terraform fmt -check -recursive
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
          bash -n scripts/*.sh
          ./scripts/test-recovery-point.sh
          OCI_INSTANCE_ID=plan-test \
          ./scripts/restore-recovery-point.sh | grep -q '^Plan only\.'

      - name: Validate Rekov JCFlow Frappe app metadata
        run: |
          test -f pyproject.toml
          test -f rekov_jcflow/hooks.py
          test -f rekov_jcflow/modules.txt
          python3 -m compileall -q rekov_jcflow
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("rekov_jcflow/doctype/jcflow_settings/jcflow_settings.json")
          data = json.loads(path.read_text())
          assert data["doctype"] == "DocType"
          assert data["name"] == "JCFlow Settings"
          assert data["issingle"] == 1
          assert {field["fieldname"] for field in data["fields"]} >= {
              "environment", "api_key", "company"
          }
          log = json.loads(Path("rekov_jcflow/doctype/jcflow_transmission_log/jcflow_transmission_log.json").read_text())
          assert log["name"] == "JCFlow Transmission Log"
          assert {field["fieldname"] for field in log["fields"]} >= {
              "sales_invoice", "status", "request_json", "response_json"
          }
          print("Frappe app metadata is valid")
          PY
