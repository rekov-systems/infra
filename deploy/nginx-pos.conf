server {
  listen 80;
  server_name ~^(?<tenant_slug>[^.]+)\.desk\.rekov\.co$;
  root /usr/share/nginx/html/rms;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

server {
  listen 80;
  server_name control.desk.rekov.co;
  root /usr/share/nginx/html/control;
  index index.html;

  location = / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
  }

  location = /app.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /styles.css {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /config.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /pos-upstream.json {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri =404;
  }

  location ~* \.(?:js|css|woff2?|png|jpe?g|svg|webp|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /control {
    return 301 /control/;
  }

  location ^~ /control/ {
    try_files $uri $uri/ /control/index.html;
    add_header Cache-Control "no-cache";
  }

  location = /rms {
    return 302 /rms/dashboard;
  }

  location ^~ /rms/ {
    try_files $uri $uri/ /rms/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    proxy_pass http://desk-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
