services:
  functions:
    environment:
      TENANT_SECRETS_ENCRYPTION_KEY: ${TENANT_SECRETS_ENCRYPTION_KEY:-}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      WHATSAPP_EMBEDDED_CONFIG_ID: ${WHATSAPP_EMBEDDED_CONFIG_ID:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v26.0}
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID:-}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${CLOUDFLARE_WORKERS_AI_TOKEN:-}
      WORKERS_AI_CHAT_MODEL: ${WORKERS_AI_CHAT_MODEL:-@cf/deepseek-ai/deepseek-v4.1-flash-1017}
      WORKERS_AI_EMBEDDING_MODEL: ${WORKERS_AI_EMBEDDING_MODEL:-@cf/baai/bge-m3}
      WORKERS_AI_VISION_MODEL: ${WORKERS_AI_VISION_MODEL:-@cf/llava-hf/llava-1.5-7b-hf}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:-}
      RAPPI_API_BASE: ${RAPPI_API_BASE:-}
      RAPPI_CLIENT_ID: ${RAPPI_CLIENT_ID:-}
      RAPPI_CLIENT_SECRET: ${RAPPI_CLIENT_SECRET:-}
      RAPPI_WEBHOOK_SECRET: ${RAPPI_WEBHOOK_SECRET:-}
      RAPPI_IP_ALLOWLIST: ${RAPPI_IP_ALLOWLIST:-}
      RMS_PLATFORM_ADMIN_EMAIL: ${RMS_PLATFORM_ADMIN_EMAIL:-}
      RMS_PLATFORM_ADMIN_PASSWORD: ${RMS_PLATFORM_ADMIN_PASSWORD:-}

  api-gw:
    ports: !override
      - "127.0.0.1:8000:8000/tcp"

  supavisor:
    ports: !override []

  rms-caddy:
    image: caddy:2-alpine
    container_name: rms-caddy
    network_mode: host
    restart: unless-stopped
    volumes:
      - /opt/rms/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/rms/caddy-data:/data
      - /opt/rms/caddy-config:/config
