[project]
name = "rekov_factus"
authors = [
  { name = "Rekov Systems" }
]
description = "Private Factus DIAN integration for Frappe and ERPNext"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]
pre-commit = "~=3.0"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
